---
## Generated by Ansible (mqtt)
# REF: https://docs.docker.com/compose/compose-file/

## Networks
#  REF: https://docs.docker.com/compose/compose-file/06-networks/
networks:
  mqtt:
    name: mqtt
    external: true

## Services
#  REF: https://docs.docker.com/compose/compose-file/05-services/
services:

  # Mosquitto (MQTT)
  # REFs:
  # - https://mosquitto.org/
  # - https://hub.docker.com/_/eclipse-mosquitto/
  mosquitto:
    profiles: [mosquitto]
    image: eclipse-mosquitto:${MOSQUITTO_VERSION:-latest}
    container_name: ${MOSQUITTO_CONTAINER:-mosquitto}
    restart: ${MOSQUITTO_RESTART:-unless-stopped}
    pull_policy: ${MOSQUITTO_PULL:-missing}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/ssl:/etc/ssl:ro
      - ${MOSQUITTO_CONFIG_DIR:-/etc/mosquitto}:/mosquitto/config:ro
      - ${MOSQUITTO_DATA_DIR:-/var/lib/mosquitto}:/mosquitto/data
      - ${MOSQUITTO_LOG_DIR:-/var/log/mosquitto}:/mosquitto/log
    networks:
      - mqtt
    ports:
      - ${MOSQUITTO_BIND:-0.0.0.0}:${MOSQUITTO_PORT:-1883}:1883
      - ${MOSQUITTO_BIND:-0.0.0.0}:${MOSQUITTO_PORT_SSL:-8883}:8883

  # Zigbee2MQTT
  # REFs:
  # - https://www.zigbee2mqtt.io
  # - https://www.zigbee2mqtt.io/guide/installation/02_docker.html
  # - https://hub.docker.com/r/koenkk/zigbee2mqtt/
  zigbee2mqtt:
    profiles: [zigbee2mqtt]
    image: koenkk/zigbee2mqtt:${ZIGBEE2MQTT_VERSION:-latest}
    container_name: ${ZIGBEE2MQTT_CONTAINER:-zigbee2mqtt}
    restart: ${ZIGBEE2MQTT_RESTART:-unless-stopped}
    pull_policy: ${ZIGBEE2MQTT_PULL:-missing}
    #user: uid:gid
    #group_add: [dialout]
    devices:
      - ${ZIGBEE2MQTT_DEVICE:-/dev/ttyUSB0}:/dev/tty${ZIGBEE2MQTT_DEVICE_TYPE:-USB}0
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/ssl:/etc/ssl:ro
      - ${ZIGBEE2MQTT_DATA_DIR:-/var/lib/zigbee2mqtt}:/app/data
      - ${ZIGBEE2MQTT_LOG_DIR:-/var/log/zigbee2mqtt}:/app/data/log
      #- /run/udev:/run/udev:ro
    networks:
      - mqtt
    ports:
      - ${ZIGBEE2MQTT_BIND:-0.0.0.0}:${ZIGBEE2MQTT_PORT:-8080}:8080

  # Home Assistant
  # REFs:
  # - https://www.home-assistant.io
  # - https://www.home-assistant.io/installation/alternative#docker-compose
  # TODO (maybe better located in a dedicated Ansible role ?)
